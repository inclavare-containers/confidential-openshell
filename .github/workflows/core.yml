name: Core contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libseccomp-dev protobuf-compiler python3-cryptography python3-yaml git-lfs
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: core-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Cache locked Rust dependencies
        run: cargo fetch --locked
      - name: Run offline contracts
        run: bash tests/run-core.sh
