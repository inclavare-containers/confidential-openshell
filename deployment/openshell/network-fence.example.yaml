# Namespace-wide default ingress denial; role rules are owned by the driver.
# This policy selects Ingress only. The driver owns workload egress rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: confidential-ingress-default-deny
  namespace: openshell
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
