apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshell-sandbox
  namespace: openshell
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshell-gateway
  namespace: openshell
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openshell-confidential-gateway
  namespace: openshell
rules:
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [create, delete, get, list, watch, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, events, secrets, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshell-confidential-gateway
  namespace: openshell
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshell-confidential-gateway
subjects:
  - kind: ServiceAccount
    name: openshell-gateway
    namespace: openshell
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshell-confidential-gateway
rules:
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    resourceNames: [kata-remote]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumes, nodes, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshell-confidential-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openshell-confidential-gateway
subjects:
  - kind: ServiceAccount
    name: openshell-gateway
    namespace: openshell
---
apiVersion: v1
kind: Secret
metadata:
  name: openshell-gateway-token
  namespace: openshell
  annotations:
    kubernetes.io/service-account.name: openshell-gateway
type: kubernetes.io/service-account-token
