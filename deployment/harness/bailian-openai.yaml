# Bailian's OpenAI-compatible API; use the host of your selected Base URL.
# These executable paths belong to the digest-pinned Community base image.
id: bailian-openai
display_name: Bailian OpenAI-compatible API
description: Bailian access for OpenCode and Codex in the Community image
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: Approved inference API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: dashscope.aliyuncs.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/lib/node_modules/opencode-ai/**
  - /usr/lib/node_modules/@openai/codex/**
