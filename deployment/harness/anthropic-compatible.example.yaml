# Copy privately and set the exact approved inference host and port.
id: coding-anthropic
display_name: Claude Code inference
description: Approved Anthropic-compatible endpoint for Claude Code
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: Approved inference API key
    env_vars: [ANTHROPIC_API_KEY]
    required: true
    auth_style: header
    header_name: x-api-key
discovery:
  credentials: [api_key]
endpoints:
  - host: inference.example.internal
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/local/bin/claude]
