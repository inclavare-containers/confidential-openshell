# The upstream restrictive default, with persistent workspace access.
# https://github.com/NVIDIA/OpenShell/blob/v0.1.6/crates/openshell-policy/src/lib.rs
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies: {}
