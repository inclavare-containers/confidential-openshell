# Bailian's Anthropic-compatible API; use the host of your selected Base URL.
id: bailian-anthropic
display_name: Bailian Anthropic-compatible API
description: Bailian access for Claude Code in the Community image
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: Approved inference API key
    env_vars: [ANTHROPIC_API_KEY]
    required: true
    auth_style: header
    header_name: x-api-key
discovery:
  credentials: [api_key]
endpoints:
  - host: dashscope.aliyuncs.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/local/bin/claude]
