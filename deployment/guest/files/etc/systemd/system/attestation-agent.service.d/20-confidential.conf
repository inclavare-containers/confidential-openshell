[Unit]
Requires=process-user-data.service systemd-time-wait-sync.service
After=process-user-data.service systemd-time-wait-sync.service

[Service]
ExecStartPre=/usr/local/libexec/openshell-guest/check-initdata
ExecStart=
ExecStart=/usr/local/bin/attestation-agent -c /run/peerpod/aa.toml --initdata-toml /run/peerpod/initdata.toml
Restart=no
