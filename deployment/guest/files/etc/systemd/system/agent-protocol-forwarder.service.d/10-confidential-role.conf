[Unit]
Requires=process-user-data.service
Requires=kata-agent.service
BindsTo=kata-agent.service
After=process-user-data.service kata-agent.service

[Service]
EnvironmentFile=/run/peerpod/workspace-required.env
Environment=APF_SEALED_VOLUME_MANIFEST=/run/peerpod/openshell-bootstrap.json
ExecStartPre=/usr/local/libexec/openshell-guest/check-initdata
