[http_server]
sockets = ["0.0.0.0:8443"]
private_key = "/etc/trustee/tls/server.key"
certificate = "/etc/trustee/tls/server-chain.pem"
insecure_http = false

[attestation_token]
trusted_certs_paths = ["/etc/trustee/tls/ca.pem"]
insecure_header_jwk = false

[attestation_service]
type = "coco_as_grpc"
as_addr = "http://127.0.0.1:50004"

[attestation_service.policy_id_map]
openshell-tdx = ["openshell-tdx"]

[admin]
authorization_mode = "AuthenticatedAuthorization"

[admin.authentication.bearer_jwt]
identity_providers = [{ issuer = "confidential-openshell-driver", audience = "kbs-admin", public_key_uri = "file:///etc/trustee/admin-public.pem" }]

[admin.authorization.regex_acl]
acls = [
  { role = "confidential-openshell", allowed_endpoints = "^/kbs/v0/resource/default/(bootstrap/[0-9a-f]{64}|workspace/[0-9a-f]{64}|bootstrap-signer/key)$" },
  { role = "confidential-openshell", allowed_endpoints = "^/kbs/v0/(resource-policy|attestation-policy|reference-value(/measurement[.][A-Za-z0-9_.-]+)?)$" }
]

[[plugins]]
name = "resource"
storage_backend_type = "kvstorage"

[storage_backend]
storage_type = "LocalFs"

[storage_backend.backends.local_fs]
dir_path = "/opt/trustee/kbs/storage"
