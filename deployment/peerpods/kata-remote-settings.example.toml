# Merge these keys into the corresponding sections of the installed Kata
# remote configuration. This is a fragment, not a complete replacement.
[hypervisor.remote]
shared_fs = "none"

[runtime]
experimental_force_guest_pull = true
# First use verifies the entire new ESSD before creating its persistent LUKS
# header. Keep the RPC alive for that scan and encrypted filesystem setup.
create_container_timeout = 600
