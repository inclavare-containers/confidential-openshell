# Operator copy only. No Python/curl/interpreter wildcard inference access.
id: confidential-opencode
display_name: Approved OpenCode inference
description: Single executable and exact approved OpenAI-compatible endpoint
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: Existing approved inference credential
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: inference.example.internal
    port: 8443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/local/bin/opencode]
